[project]
name = "dino-mask-extraction"
version = "0.1.0"
description = "DINOv3 feature extraction over ImageNet"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "transformers>=4.56.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "gradio>=4.44.0",
    "accelerate>=1.0.0",
    "pyyaml>=6.0",
    "opencv-python>=4.8",
    "matplotlib>=3.11.0",
    "scikit-learn>=1.9.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
